services:
  mysql-db:
    image: mysql:8.0
    container_name: mysql-pcparts
    restart: always
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-alejandrof15}
      MYSQL_DATABASE: ${DB_NAME:-pcparts}
    ports:
      - "3308:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  postgres-db:
    image: postgres:15-alpine
    container_name: postgres-pcparts
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-alejandrof15}
      POSTGRES_DB: ${DB_NAME:-pcparts}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  pgloader:
    image: dimitri/pgloader:latest
    container_name: pgloader-migration
    depends_on:
      - mysql-db
      - postgres-db
    profiles:
      - migration
    command: >
      pgloader mysql://root:${DB_PASSWORD:-alejandrof15}@mysql-db/${DB_NAME:-pcparts} postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-alejandrof15}@postgres-db/${DB_NAME:-pcparts}

  backend:
    build: .
    # Nombre de imagen explicito: sin esto compose la deriva del directorio
    # del proyecto (CRUD) y quedaria etiquetada como 'crud-backend'.
    image: cotizadorpc-backend
    container_name: cotizadorpc-backend
    restart: unless-stopped
    depends_on:
      - postgres-db
    ports:
      - "${PORT:-3000}:3000"
    env_file:
      - .env

volumes:
  mysql_data:
  postgres_data:
